name: Build and Release

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "37 21 * * *"
    - cron: "37 21 1,16 * *"
  workflow_dispatch:
    inputs:
      releaseNightly:
        description: 'Release as nightly'
        required: false
        default: false
        type: boolean
      releaseName:
        description: 'Release name'
        type: string

env:
  BUILD_TYPE: Release
  PROJECT_NAME: DDNG

jobs:
  check-changes:
    name: Check for recent changes
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs: 
      should_run: ${{ steps.should_run_daily.outputs.should_run || steps.battle_pass.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for changes last 24 hours
        id: should_run_daily
        shell: bash
        run: |
          git log --since="1 days ago" --name-only
          echo "should_run=$(git log --since="1 days ago" --name-only | grep "" -c)" >> "$GITHUB_OUTPUT"
      - name: Check if it's a fortnite job
        if: github.event.schedule == '37 21 1,16 * *'
        id: battle_pass
        shell: bash
        run: echo "should_run=true" >> "$GITHUB_OUTPUT"

  build-skse:
    runs-on: windows-2022
    needs: check-changes
    if: ${{ always() && (needs.check-changes.outputs.should_run >= 1 || github.event_name == 'workflow_dispatch') }}

    steps:
    - uses: actions/checkout@v4
    - uses: lukka/get-cmake@latest

    - name: Cache vcpkg packages
      uses: lukka/run-vcpkg@v11
        
    - name: Run CMake
      uses: lukka/run-cmake@v10
      with:
        cmakeListsTxtPath: '${{ github.workspace }}/CMakeLists.txt'
        configurePreset: build-release-msvc
        configurePresetAdditionalArgs: "['-DCMAKE_TOOLCHAIN_FILE:STRING=C:/vcpkg/scripts/buildsystems/vcpkg.cmake']"
        buildPreset: release-msvc

    - name: Move binaries
      run: |
        cd ${{github.workspace}}/build/release-msvc
        mkdir temp
        cd temp
        move ../DeviousDevices.dll
        move ../DeviousDevices.pdb
    
    - name: Upload DLL artifact
      uses: actions/upload-artifact@v4
      with:
        # Artifact name
        name: ${{ env.PROJECT_NAME }}-DLL
        # A file, directory or wildcard pattern that describes what to upload
        path: build/release-msvc/temp
        # The desired behavior if no files are found using the provided path.
        retention-days: 90

  build-papyrus:
    runs-on: windows-2022
    needs: check-changes
    if: ${{ always() && (needs.check-changes.outputs.should_run >= 1 || github.event_name == 'workflow_dispatch') }}

    steps:
    - uses: actions/checkout@v4

    - name: Copy PAPYRUS sources
      uses: GuillaumeFalourd/clone-github-repo-action@v2
      with:
        owner: 'IHateMyKite'
        repository: 'PapyrusSourcesDD'

    - name: Run build scripts
      run: >
        PapyrusSourcesDD/PapyrusCompiler "dist/scripts/source"
        -o="compiled_pex" -all 
        -i="dist/scripts/source;PapyrusSourcesDD/SRC;PapyrusSourcesDD/SRC_LAL;PapyrusSourcesDD/SRC_ZAZ;PapyrusSourcesDD/SRC_OTHER;PapyrusSourcesDD/SRC_PO3;PapyrusSourcesDD/SRC_DD;PapyrusSourcesDD/SRC_SKYUI;PapyrusSourcesDD/SRC_PAPUTIL;PapyrusSourcesDD/SRC_SXL;PapyrusSourcesDD/SRC_MFG;PapyrusSourcesDD/SRC_RM;PapyrusSourcesDD/SRC_FNIS;PapyrusSourcesDD/SRC_SLA;PapyrusSourcesDD/SRC_XPMSE;PapyrusSourcesDD/SRC_SLIF"
        -optimize -f="PapyrusSourcesDD/Flags.flg"

    - name: Upload PEX artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.PROJECT_NAME }}-PEX
        path: ${{ github.workspace }}/compiled_pex
        retention-days: 90

  compose-release:
    runs-on: ubuntu-latest
    needs: [build-skse, build-papyrus]
    # always(): this job is needed on workflow_dispatch too, where check-changes
    # is skipped (so the implicit success() would otherwise skip this job as
    # well, and a dispatch run would never produce an archive).
    if: ${{ always() && needs.build-skse.result == 'success' && needs.build-papyrus.result == 'success' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute archive name
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep -oP '^\s*VERSION\s+\K[0-9]+(\.[0-9]+)*' CMakeLists.txt | head -n1)
          [ -n "${version}" ] || version=0.0.0.0
          sha7="${GITHUB_SHA:0:7}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "sha7=${sha7}" >> "$GITHUB_OUTPUT"
          echo "archive=DDNG-${version}-${sha7}" >> "$GITHUB_OUTPUT"

      - name: Download DLL
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME}}-DLL
          path: artifacts/${{ env.PROJECT_NAME }}-DLL

      - name: Download PEX
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME}}-PEX
          path: artifacts/${{ env.PROJECT_NAME }}-PEX

      - name: Stage complete mod, zip deterministically
        shell: bash
        run: |
          set -euo pipefail
          stage="staging/DDNG"
          mkdir -p "$stage"

          # Overlay files tracked in dist/ (Seq/, SKSE/, scripts/source/).
          cp -a dist/. "$stage/"

          # Root records. Upstream's DDNG.zip is only an overlay for an existing
          # Devious Devices install and omits these; an archive that Amethyst can
          # install standalone needs them.
          cp -v ./*.esm ./*.esp ./*_KID.ini "$stage/"

          # Build outputs.
          mkdir -p "$stage/SKSE/Plugins"
          cp -av artifacts/${PROJECT_NAME}-DLL/. "$stage/SKSE/Plugins/"
          cp -av artifacts/${PROJECT_NAME}-PEX/. "$stage/scripts/"

          # Reproducible archive: fixed mtimes, sorted entries, no extra fields.
          # Zip the *contents* of the staging dir so the archive root is the mod
          # root (ESMs/ESP/KID.ini, SKSE/, Seq/, scripts/), like upstream's
          # DDNG.zip, not a single top-level DDNG/ folder.
          find "$stage" -exec touch -h -d '2020-01-01T00:00:00Z' {} +
          out="$(pwd)/${{ steps.meta.outputs.archive }}.zip"
          ( cd "$stage" && find . -type f -printf '%P\n' | LC_ALL=C sort | zip -X -q "$out" -@ )

          echo "### Archive ${{ steps.meta.outputs.archive }}.zip" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          unzip -l "$out" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Verify archive contains the master files
        shell: bash
        run: |
          set -euo pipefail
          zip="${{ steps.meta.outputs.archive }}.zip"
          for f in "Devious Devices - Assets.esm" \
                   "Devious Devices - Contraptions.esm" \
                   "Devious Devices - Expansion.esm" \
                   "Devious Devices - Integration.esm" \
                   "Devious Devices SE patch.esp" \
                   "Devious Devices_KID.ini" \
                   "SKSE/Plugins/DeviousDevices.dll" \
                   "SKSE/Plugins/DeviousDevices.ini"; do
            unzip -l "$zip" | grep -qF "$f" || { echo "MISSING: $f"; exit 1; }
          done
          echo "all expected files present"

      - name: Upload complete archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-archive
          path: ${{ steps.meta.outputs.archive }}.zip
          retention-days: 90

  publish-dispatch-release:
    # Publish the archive as a GitHub Release on this repository (the fork).
    # workflow_dispatch only, and not when the caller asked for a nightly.
    runs-on: ubuntu-latest
    needs: [compose-release]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && !inputs.releaseNightly && needs.compose-release.result == 'success' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-archive
          path: release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="ci-${GITHUB_SHA:0:7}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "CI build ${{ github.sha }}" \
              --notes "Automated build of commit ${{ github.sha }} (branch ${GITHUB_REF_NAME})."
          fi
          gh release upload "$tag" release/*.zip --clobber
          echo "Release: $(gh release view "$tag" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          gh release view "$tag" --json assets --jq '.assets[] | "\(.name)  \(.size) bytes  \(.url)"' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  release-nightly:
    if: ${{ always() && (github.event_name == 'schedule' || inputs.releaseNightly) && needs.compose-release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [compose-release]
    steps:
      - uses: actions/checkout@v4
    
      - name: Download archive
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-archive
          path: release

      - uses: Kaven-Universe/github-action-current-date-time@v1
        id: date_rough
        with:
          format: "YYYYMMDD"

      - uses: Kaven-Universe/github-action-current-date-time@v1
        id: date_pretty
        with:
          format: "DD/MM/YYYY"

      - name: Create nightly release
        id: create_release
        uses: viperproject/create-nightly-release@v1.1.12
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: nightly-${{ inputs.releaseNightly && inputs.releaseName || steps.date_rough.outputs.time}}
          release_name: Nightly Release ${{ steps.date_pretty.outputs.time }}
          body: Nightly release. Alpha build - be wary of bugs. Must be installed manually.
          keep_num: 2
          keep_tags: false

      - name: Upload Release Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: >
          gh release
          upload
          nightly-${{ inputs.releaseNightly && inputs.releaseName || steps.date_rough.outputs.time}}
          release/*.zip --clobber
